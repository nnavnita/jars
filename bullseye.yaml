# bullseye.yaml — convergence targets for this project.
#
# Targets are desired project states expressed as testable properties,
# with dependency tracking and frontier computation. This file is the
# source of truth: read and written by the bullseye MCP server, and safe
# to hand-edit (the targets live below).
#
# What is bullseye / how do I install it?
#   https://github.com/marcelocantos/bullseye
#
# This banner is regenerated by bullseye on every write — edit the
# targets, not these lines.
schema_version: 5
targets:
  T1:
    name: A jar of folded notes can be filled and drawn from at random
    status: achieved
    value: 5.0
    cost: 3.0
    acceptance:
    - 'A jar can be created, named, and filled with one-line notes'
    - 'Notes in a jar are folded shut, so no note can be read or cherry-picked before it is drawn'
    - 'Drawing picks uniformly at random and never returns the same note twice running unless it is the only one left'
    - 'A drawn note unfolds to show its text, offering back-in-jar, done, and trash'
    - 'Done removes the note with no history kept; trash moves it to a recoverable bin'
    - 'Both destructive outcomes offer a 5-second undo'
    - 'cargo test -p jars-core passes'
    context: 'Domain logic is pure and lives in core/ so it tests without a browser. A drawn note stays in the model while shown — only the renderer hides it — so a reload mid-reveal cannot lose it.'
    tags:
    - core
    origin: hand
    discovered: 2026-10-04
    achieved: 2026-10-04
  T2:
    name: A jar looks like painted paper in glass, and visibly empties as it is used
    status: achieved
    value: 5.0
    cost: 3.0
    acceptance:
    - 'Jars render in watercolour with a hand-drawn wobble and paper grain, from no art assets'
    - 'A jar is drawn once per hue and blitted, never regenerated inside a frame loop'
    - 'Fill level reads at a glance at every count from full to empty, in the palest palette'
    - 'A note''s position in the pile is stable across reloads and does not shift when another note is drawn'
    - 'Six jars on a shelf are six distinguishable colours'
    context: 'SVG feTurbulence and feDisplacementMap do the painting; the browser rasterizes once and Canvas2D blits. The inner shadow pooling at the jar base is what makes a draining pale jar legible.'
    tags:
    - render
    origin: hand
    discovered: 2026-10-04
    achieved: 2026-10-04
  T3:
    name: Jars survive the browser, and can be handed to someone else
    status: achieved
    value: 4.0
    cost: 2.0
    acceptance:
    - 'Jars persist across reloads in IndexedDB, with persistent storage requested'
    - 'A jar exports to a file and imports as a new jar, with colliding names suffixed'
    - 'A malformed import changes nothing; an import from a newer version is refused with a clear message'
    - 'Chrome and Edge keep one backup file current in place; other browsers get a manual export plus an overdue nudge'
    - 'Storage being unavailable is surfaced rather than failing silently'
    - 'A deleted jar is recoverable from the recycling bin until that is emptied'
    - 'Saved data that cannot be read is set aside rather than overwritten, and the user is told'
    context: 'Local-only by design — no accounts, no server. Silent overwrite needs the File System Access API, which Safari and Firefox do not implement, hence the two paths.'
    tags:
    - storage
    origin: hand
    discovered: 2026-10-04
    achieved: 2026-10-04
  T4:
    name: The app is live at nnavnita.com/jars and installable
    status: active
    value: 4.0
    cost: 1.0
    acceptance:
    - 'Pushing to main builds and deploys to GitHub Pages'
    - 'The app loads and runs at nnavnita.com/jars with every asset resolving under the subpath'
    - 'Deep links to a jar survive a cold load'
    - 'It installs to a phone home screen and opens offline'
    context: 'Needs the GitHub repo created and Pages set to deploy from Actions. Hash routing avoids 404s on a static subpath host; the service worker is skipped on localhost.'
    tags:
    - deploy
    origin: hand
    discovered: 2026-10-04
  T5:
    name: Every action looks like the physical thing it stands for
    status: achieved
    value: 4.0
    cost: 3.0
    acceptance:
    - 'A drawn note unfolds along its crease, and folds itself back up when put back'
    - 'Marking a note done stamps DONE across it before it lifts away'
    - 'Trashing a note crushes it into a ball \u2014 the outline itself buckles, not just a shrinking card'
    - 'A new jar arrives in a cardboard box whose label you handwrite before it opens'
    - 'Deleting a jar lobs it into a recycling bin, lid flapping'
    - 'Nothing is tappable while it is still moving'
    context: 'The crush animates clip-path vertices rather than transform, because a transform is affine and can only squash a rectangle smoothly. Type is Reenie Beanie, bundled under the OFL.'
    tags:
    - render
    - feel
    origin: hand
    discovered: 2026-10-04
    achieved: 2026-10-04
  T6:
    name: The draw feels like reaching into a jar rather than clicking a button
    status: active
    value: 3.0
    cost: 2.0
    acceptance:
    - 'Notes settle into the pile with some weight rather than appearing in place'
    - 'The shake and the note leaving the jar read as one continuous motion'
    - 'Animation holds 60fps on a mid-range phone with a jar of fifty notes'
    - 'Nothing is tappable while it is still moving'
    context: 'Currently a deterministic settle, roughly 100 lines, with no physics dependency. rapier2d is the documented upgrade if the drop still feels dead — it costs about 300KB of wasm, so it needs to earn its place.'
    tags:
    - render
    - feel
    origin: hand
    discovered: 2026-10-04
