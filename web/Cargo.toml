[package]
name = "jars-web"
description = "Browser front-end for jars: Leptos UI with a Canvas2D jar scene."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
jars-core = { path = "../core" }
leptos = { version = "0.8", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
rexie = "0.6"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "Blob",
  "BlobPropertyBag",
  "CanvasRenderingContext2d",
  "Crypto",
  "CssStyleDeclaration",
  "Document",
  "DomRect",
  "Element",
  "Event",
  "EventTarget",
  "File",
  "FileList",
  "FileReader",
  "HtmlAnchorElement",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlImageElement",
  "HtmlInputElement",
  "Location",
  "MouseEvent",
  "Navigator",
  "Path2d",
  "Performance",
  "ServiceWorkerContainer",
  "Storage",
  "TextMetrics",
  "StorageManager",
  "Url",
  "Window",
  "console",
]
